name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare README as homepage
        run: |
          mkdir -p _pages
          printf '%s\n' '---' 'title: colab-package-test' '---' > _pages/index.md
          cat README.md >> _pages/index.md
      - name: Build page
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site
      - name: Upload page
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy page
        id: deployment
        uses: actions/deploy-pages@v4
